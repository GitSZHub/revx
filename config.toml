# Non-secret settings. Secrets (REVX_API_KEY) come from .env at runtime.
# All numbers are parsed as Decimal or int.

[mode]
# Live orders need DRY_RUN = false here AND the --live CLI flag.
DRY_RUN = true

[api]
base_url = "https://revx.revolut.com"
private_key_path = "keys/private.pem"
timeout_seconds = 10
max_consecutive_errors = 5      # kill switch: halt after this many API errors in a row
daily_order_budget = 200        # the exchange limit is 1000 per day

[paths]
ledger = "ledger.db"
backups = "backups"
halt_file = "HALT"

[loop]
interval_seconds = 300
unfilled_cancel_minutes = 30

[strategy]
pairs = ["BTC-EUR", "ETH-EUR"]
candle_interval_minutes = 240
tranche_eur = 50
max_open_lots = 8
max_open_lots_per_pair = 5
bollinger_period = 20
bollinger_stddev = 2
atr_period = 14
spacing_atr_mult = 1.5
vol_window = 20                 # candles in each realized-vol reading
vol_lookback_days = 90
vol_max_percentile = 95
signal = "bollinger_dip"        # entry signal; see revx/signals.py
band_width_pct = 0.15           # at most band_max_lots open lots per pair within any price range this wide
band_max_lots = 2
breakout_atr_mult = 2           # a candle whose open-to-close move is at least this many ATRs is a breakout
breakout_cooldown_candles = 8   # no new lot while any of the last N closed candles is a breakout (8 x 4h = 32h)

[exit]
min_profit = 0.03
trail_atr_mult = 3
partial_pct = 0

[reconcile]
tolerance_pct = 0.005
abs_tolerance_eur = 0.02
abs_tolerance_crypto = 0.000001

[dry_run]
starting_eur = 400              # simulated cash for dry-run and the backtester

[report]
target_multiple = 10
